[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hash-auditor"
version = "0.1.0"
description = "Audit passwords, compute hashes, identify hash types, and crack your own hashes with a wordlist."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["hash", "password", "security", "crack", "audit", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
]

[project.scripts]
hashaudit = "hash_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
