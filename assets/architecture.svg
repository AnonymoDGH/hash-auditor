<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#010409"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <rect width="820" height="400" fill="url(#bg)"/>
  <text x="410" y="40" fill="#e6edf3" font-size="22" font-weight="700" text-anchor="middle">Hash Auditor — Architecture</text>

  <!-- Audit -->
  <rect x="30" y="70" width="220" height="130" rx="10" fill="url(#box)" stroke="#f0883e" stroke-width="2"/>
  <text x="140" y="100" fill="#f0883e" font-size="15" font-weight="700" text-anchor="middle">audit</text>
  <text x="140" y="124" fill="#8b949e" font-size="12" text-anchor="middle">length · classes · entropy</text>
  <text x="140" y="142" fill="#8b949e" font-size="12" text-anchor="middle">weak list · patterns</text>
  <text x="140" y="160" fill="#8b949e" font-size="12" text-anchor="middle">flags → verdict</text>

  <!-- Hash -->
  <rect x="30" y="230" width="220" height="90" rx="10" fill="url(#box)" stroke="#58a6ff" stroke-width="2"/>
  <text x="140" y="260" fill="#58a6ff" font-size="15" font-weight="700" text-anchor="middle">hash / identify</text>
  <text x="140" y="284" fill="#8b949e" font-size="12" text-anchor="middle">md5 · sha1 · sha256 · sha512</text>
  <text x="140" y="302" fill="#8b949e" font-size="12" text-anchor="middle">length → algorithm</text>

  <!-- Wordlist -->
  <rect x="330" y="240" width="180" height="70" rx="10" fill="url(#box)" stroke="#f85149" stroke-width="2"/>
  <text x="420" y="270" fill="#f85149" font-size="14" font-weight="700" text-anchor="middle">wordlist</text>
  <text x="420" y="292" fill="#8b949e" font-size="12" text-anchor="middle">rockyou.txt style</text>

  <!-- Crack -->
  <rect x="600" y="140" width="190" height="130" rx="10" fill="url(#box)" stroke="#3fb950" stroke-width="2"/>
  <text x="695" y="172" fill="#3fb950" font-size="15" font-weight="700" text-anchor="middle">crack</text>
  <text x="695" y="196" fill="#8b949e" font-size="12" text-anchor="middle">candidate → hash → match?</text>
  <text x="695" y="214" fill="#8b949e" font-size="12" text-anchor="middle">mutations: Cap1tals</text>
  <text x="695" y="232" fill="#8b949e" font-size="12" text-anchor="middle">+123, +!, ! prefix</text>
  <text x="695" y="254" fill="#3fb950" font-size="12" text-anchor="middle">→ FOUND: "sunshine"</text>

  <!-- Arrows -->
  <path d="M 250 130 C 300 130, 560 130, 600 175" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 250 275 L 330 275" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 510 275 C 560 275, 560 250, 600 230" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 140 200 L 140 230" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>

  <text x="410" y="375" fill="#8b949e" font-size="11" text-anchor="middle">Audit your own habits, crack your own hashes. Fiction prop for novel research.</text>
</svg>
